name: Build Glint Play AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/build-play-aab.yml"

jobs:
  build-aab:
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_BACKEND_URL: https://glint-api-xf2i.onrender.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Prepare Android app resources
        working-directory: frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          manifest.write_text(s)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "splashscreen_logo.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#4CAF70"
                  android:pathData="M48,8A40,40 0,1 0,48 88A40,40 0,1 0,48 8Z"/>
          </vector>
          """)
          PY

      - name: Build Android App Bundle
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: glint-play-aab-unsigned
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
